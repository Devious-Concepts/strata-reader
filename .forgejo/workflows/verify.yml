# Runs the three stages of the release gate in RELEASING.md on demand, one job per stage.
# Keep the commands identical to RELEASING.md. Manual dispatch only: no push or pull request
# triggers.
name: Verify
on:
  workflow_dispatch:
jobs:
  fast:
    name: Fast checks
    runs-on: home-ci
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the development compiler from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: home-ci
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the rust-version compiler from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "No rust-version found in Cargo.toml" >&2
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal
          rustc +"$msrv" --version
          echo "msrv=$msrv" >> "$GITHUB_ENV"
      - run: cargo +"$msrv" test --all-targets --all-features
      - run: cargo +"$msrv" test --doc --all-features

  package:
    name: Package
    runs-on: home-ci
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the development compiler from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - run: cargo package --list
      - run: cargo package
      - name: Test the extracted package
        run: |
          cd target/package/strata-reader-*/
          cargo test --all-features
